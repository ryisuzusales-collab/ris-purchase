<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบรับใบงาน_จัดซื้อ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#EEF1F5; --surface:#FFFFFF; --ink:#1F2A44; --ink-2:#3A4766; --muted:#66718A; --line:#D9DFE8;
  --red:#C8102E; --red-bg:#FBE9EC; --amber:#A86A00; --amber-bg:#FFF3D9; --green:#2E7D5B; --green-bg:#E3F3EA;
  --blue:#2B5FAA; --blue-bg:#E6EEFA; --due-ok:#DCE3EE;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#11161F; --surface:#1A2130; --ink:#E7ECF4; --ink-2:#C3CCDB; --muted:#8C97AD; --line:#2C3547;
    --red:#FF5C6F; --red-bg:#3A1A21; --amber:#F2B544; --amber-bg:#36290F; --green:#5CC79A; --green-bg:#16332A;
    --blue:#7FA8EA; --blue-bg:#1B2A45; --due-ok:#263044;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 "IBM Plex Sans Thai","Sarabun","Noto Sans Thai",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* top bar */
.top{background:var(--ink);color:var(--paper);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
@media (prefers-color-scheme:dark){.top{background:#0B0F16;color:var(--ink)}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--ink)}
.top .wrap{display:flex;align-items:center;gap:12px;height:58px}
.brand{font-weight:700;font-size:17px;letter-spacing:.2px;margin-right:auto;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.7;margin-top:-3px}
.who{font-size:13px;text-align:right;line-height:1.3}
.who b{display:block;font-weight:600}
.iconbtn{background:transparent;border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:8px;height:36px;min-width:36px;padding:0 10px;cursor:pointer;position:relative}
.bell .n{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;line-height:18px;font-weight:700}

/* tabs */
.tabs{display:flex;gap:4px;padding:14px 0 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--red)}
.tab .c{font-size:12px;background:var(--line);border-radius:9px;padding:0 7px;margin-left:4px;color:var(--ink-2)}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* tickets */
.list{display:flex;flex-direction:column;gap:10px;padding-bottom:40px}
.ticket{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left}
.ticket:hover{border-color:var(--muted)}
.due{flex:0 0 84px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;background:var(--due-ok);color:var(--ink);text-align:center}
.due b{font-size:30px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.due span{font-size:12px;margin-top:4px}
.u-over .due{background:var(--red);color:#fff}
.u-today .due{background:var(--red-bg);color:var(--red)}
.u-soon .due{background:var(--amber-bg);color:var(--amber)}
.u-done .due{background:var(--green-bg);color:var(--green)}
.u-done{opacity:.82}
.tb{flex:1;min-width:0;padding:10px 14px}
.r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.prno{font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.type{color:var(--muted)}
.badge{margin-left:auto;font-size:12px;font-weight:600;border-radius:6px;padding:2px 9px}
.s-new{background:var(--blue-bg);color:var(--blue)}
.s-pending{background:var(--amber-bg);color:var(--amber)}
.s-done{background:var(--green-bg);color:var(--green)}
.s-trash{background:var(--line);color:var(--ink-2)}
.ttl{font-weight:600;font-size:16px;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px}
.meta b{color:var(--ink-2);font-weight:500}
.vend{font-size:13px;margin-top:4px;color:var(--ink-2)}
.empty{padding:48px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
.new-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block}

/* calendar */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhead h3{margin:0 auto 0 0;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:40px}
.dow{background:var(--surface);text-align:center;font-size:12px;color:var(--muted);padding:6px 0;font-weight:600}
.cell{background:var(--surface);min-height:104px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.empty{background:var(--paper)}
.cell .d{font-size:12px;color:var(--muted);font-weight:600;padding:0 2px}
.cell.today .d{color:#fff;background:var(--red);border-radius:10px;align-self:flex-start;padding:0 7px}
.cev{font-size:11.5px;border-radius:4px;padding:2px 5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid}
.cev.s-new{border-color:var(--blue)} .cev.s-pending{border-color:var(--amber)} .cev.s-done{border-color:var(--green)}
.cev.over{background:var(--red);color:#fff;border-color:var(--red)}

/* tables */
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;background:var(--paper)}
.scroll{overflow-x:auto;margin-bottom:40px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;overflow-y:auto}
.sheet{background:var(--surface);border-radius:12px;width:100%;max-width:680px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.sh-h{display:flex;gap:12px;align-items:flex-start;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.sh-h h2{margin:2px 0 0;font-size:20px;line-height:1.35}
.x{margin-left:auto;background:none;border:0;font-size:20px;cursor:pointer;color:var(--muted);padding:0 4px}
.sh-b{padding:16px 20px 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:12px 0}
.grid2 div span{display:block;font-size:12px;color:var(--muted)}
.sec{margin-top:18px}
.sec h4{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.box{background:var(--paper);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.file{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.file .fn{flex:1;min-width:0}
.file .fn b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fn small{color:var(--muted)}
.vrow{display:grid;grid-template-columns:1.2fr 1fr 1.2fr auto auto;gap:6px;align-items:center;margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
textarea.inp{min-height:80px;resize:vertical}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.clock{background:var(--blue-bg);color:var(--blue);border-radius:8px;padding:10px 12px;font-weight:600;margin-bottom:14px;font-variant-numeric:tabular-nums}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.foot .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted)}
.vlist .vi{display:flex;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.vlist .vi.ok{border-color:var(--green)}
.callout{background:var(--blue-bg);color:var(--blue);padding:10px 12px;border-radius:8px;font-size:14px}

/* auth */
.auth{max-width:400px;margin:8vh auto;padding:0 16px}
.auth .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.auth h1{font-size:24px;margin:0 0 4px}
.auth p{margin:0 0 18px;color:var(--muted)}
.err{color:var(--red);font-size:14px;margin:6px 0 0;min-height:20px}

/* toast */
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--ink);color:var(--paper);padding:12px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px;animation:tin .25s ease-out}
.toast.err{background:var(--red);color:#fff}
.toast.new{border-left:5px solid var(--red)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.s-edit{background:var(--red-bg);color:var(--red)}
.ticket.edited{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.alert{background:var(--red-bg);color:var(--red);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.alert b{display:block;margin-bottom:4px}
.alert ul,.hist ul{margin:6px 0 0;padding-left:18px}
.alert .btn{margin-top:10px}
.hist .h{border-left:3px solid var(--line);padding:4px 0 8px 12px;font-size:14px}
.hist .h.ack{border-color:var(--green)}
.hist .h.edit{border-color:var(--red)}
.hist small{color:var(--muted)}
.chg s{color:var(--muted)}
.soundbar{display:block;width:100%;border:0;background:var(--amber-bg);color:var(--amber);font-weight:600;padding:9px 16px;cursor:pointer;text-align:center}
/* สรุปวันนี้ */
.today-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 0 0}
.today-h h2{margin:0 auto 0 0;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0 18px}
.stat{background:var(--surface);padding:10px 14px}
.stat b{display:block;font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.hot b{color:var(--red)}
.grp{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.grp h3{margin:0;font-size:16px;display:flex;gap:8px;align-items:baseline}
.grp .step{color:var(--muted);font-variant-numeric:tabular-nums}
.grp .cnt{font-size:13px;color:var(--muted);font-weight:500}
.grp>p{margin:2px 0 6px;font-size:13px;color:var(--muted)}
.g-attn{border-left-color:var(--blue)} .g-over{border-left-color:var(--red)} .g-today{border-left-color:var(--red)} .g-soon{border-left-color:var(--amber)} .g-plan{border-left-color:var(--green)}
.trow{display:grid;grid-template-columns:86px 84px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--line);cursor:pointer}
.trow:hover{background:var(--paper)}
.tdue{font-weight:700;font-size:13px}
.g-over .tdue,.g-today .tdue{color:var(--red)} .g-soon .tdue{color:var(--amber)}
.tt{min-width:0}
.tt b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt small{color:var(--muted);font-size:12px}
.vs{font-size:12px;color:var(--muted);white-space:nowrap}
.vs.warn{color:var(--amber);font-weight:600}
.shop{border-top:1px solid var(--line);padding:10px 4px 6px}
.shop h5{margin:0;font-size:15px}
.shop h5 small{font-weight:400;color:var(--muted);margin-left:6px}
.shop ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.shop li{cursor:pointer}
@media (max-width:640px){
  .trow{grid-template-columns:70px 1fr}
  .trow .prno{display:none}
  .trow .vs{grid-column:2}
}
.lines{margin:6px 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.lines .lh{margin:0 0 8px;font-size:15px}
.line{display:grid;grid-template-columns:28px 1fr 160px auto;gap:6px;align-items:center;margin-bottom:6px}
.lhead{display:grid;grid-template-columns:28px 1fr 160px 38px;gap:6px;font-size:12px;color:var(--muted);margin-bottom:4px}
.ilist .note{white-space:nowrap}
.line.locked .lro{padding:8px 10px;background:var(--paper);border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lock,.okb{font-size:12px;color:var(--green);font-weight:600;white-space:nowrap}
.bchk{font-size:12.5px;white-space:nowrap;margin-left:6px;color:var(--green);cursor:pointer}
.ilist li.bought .it{color:var(--muted)}
.lirow{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.lirow .btn{margin-left:auto}
.doneinfo{font-size:13px;color:var(--green);margin:2px 0 6px}
.doneinfo a,.refund a{color:var(--blue)}
.budget{border:1px solid var(--line);border-radius:8px;padding:4px 12px}
.budget div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.budget div:last-child{border-bottom:0}
.budget .tot{font-weight:700;font-size:15.5px}
.unlockbox{background:var(--amber-bg);border-left:4px solid var(--amber);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.unlockbox.ok{background:var(--blue-bg);border-left-color:var(--blue)}
.unlockbox b{display:block;margin-bottom:4px}
.unlockbox .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.contacts{margin-top:10px}
.contacts .ct{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.contacts .ct>div{flex:1;min-width:0}
.contacts .ct small{display:block;color:var(--muted)}
.btn.line{background:#06C755;border-color:#06C755;color:#fff;text-decoration:none}
a.btn{text-decoration:none;display:inline-block}
.chk{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.fadd{margin:6px 0}
.refund{font-size:13.5px;margin-top:8px}
.lines.locked-g{opacity:.85}

@media (max-width:640px){.line{grid-template-columns:24px 1fr auto}.line .ld{grid-column:2}.lhead{display:none}}
.line .ln{color:var(--muted);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.ilist{margin:0;padding-left:22px}
.ilist li{padding:2px 0}
.rtdot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;background:#999}
.rtdot.ok{background:#3BC07A}.rtdot.bad{background:#FF5C6F}.rtdot.wait{background:#F2B544}
.s-ret{background:var(--amber-bg);color:var(--amber)}
.ret{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.ret.received{border-left-color:var(--green)}
.ret .r1 .badge{margin-left:8px}
.rrow{display:grid;grid-template-columns:1fr 110px 100px;gap:6px;align-items:center;margin-bottom:6px}
.rcl{display:flex;gap:8px;align-items:center;cursor:pointer;min-width:0}
.rcl span{overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.rrow{grid-template-columns:1fr 1fr}.rcl{grid-column:1 / -1}}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{flex:1;min-width:130px;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:12px 10px;border:2px solid var(--line);border-radius:10px;font-weight:600;background:var(--surface)}
.seg input:checked+span{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.seg input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.site{font-size:12px;font-weight:600;background:var(--ink);color:var(--paper);border-radius:5px;padding:1px 7px}
.linebar{background:var(--amber-bg);color:var(--amber);font-size:13px;padding:8px 16px;text-align:center}

@media (max-width:640px){
  .who{display:none}
  .due{flex-basis:68px} .due b{font-size:24px}
  .grid2{grid-template-columns:1fr}
  .vrow{grid-template-columns:1fr 1fr;border:1px solid var(--line);padding:8px;border-radius:8px}
  .cell{min-height:70px}
  .cev{font-size:10px;padding:1px 3px}
  .cev .t{display:none}
}
</style>
</head>

<script>
/* ======================= ตั้งค่า ======================= */
const CONFIG = {
  SUPABASE_URL: 'https://fzozxftfxtvbmuryiihf.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_WdCOu73wY1xQuM70rs6NbA_vDNO5_0-',   // Publishable key
  EMAIL_DOMAIN: 'purchase.local',      // ใช้แปลง "ชื่อผู้ใช้" เป็นอีเมลภายใน ไม่มีการส่งเมลจริง
  BUCKET: 'purchase-files',
  BRANCHES: ['สำนักงานใหญ่','ปลวกแดง],
  SITES: ['สำนักงานใหญ่', 'ปลวกแดง'],   // สาขาของใบงาน
  ITEM_GROUPS: [['purchase', 'จัดซื้อ'], ['moririn', 'โมริริน']],
  COMPANY_NAME: '',   // ชื่อบริษัทที่จะพิมพ์บนหัวใบคืนของ (เว้นว่างได้)
  MAX_FILE_MB: 50,
};

/* ======================= ตัวช่วย ======================= */
const TZ = 'Asia/Bangkok';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pr = id => 'PR-' + String(id).padStart(5, '0');
const todayYMD = () => new Date().toLocaleDateString('en-CA', { timeZone: TZ });
const ymdUTC = ymd => { const [y, m, d] = ymd.split('-').map(Number); return Date.UTC(y, m - 1, d); };

const fmtDT = iso => iso ? new Date(iso).toLocaleString('th-TH', { timeZone: TZ, day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' น.' : '-';
const fmtD = ymd => { if (!ymd) return '-'; const [y, m, d] = ymd.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' }); };
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

function toast(msg, kind = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), kind === 'new' ? 9000 : 4000);

let audioCtx;
const soundOn = () => { try { return localStorage.getItem('pr_sound') !== 'off'; } catch { return true; } };
function ensureAudio() {
  try {
    if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); audioCtx.onstatechange = updateSoundBar; }
    if (audioCtx.state !== 'running') audioCtx.resume().then(updateSoundBar).catch(() => {});
  } catch {}
  updateSoundBar();
}
function beep(force) {
  if (!force && !soundOn()) return;
  try {
    ensureAudio();
    const t0 = audioCtx.currentTime + 0.03;
    // เสียงกริ่ง 3 โน้ตไล่ขึ้น เล่น 2 รอบ
    [0, 0.9].forEach(rep => [[784, 0], [988, 0.15], [1319, 0.3]].forEach(([f, dt]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = t0 + rep + dt;
      o.type = 'triangle'; o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
      o.start(t); o.stop(t + 0.5);
    }));
  } catch {}
}
function updateSoundBar() {
  const btn = $('#soundBtn'); if (btn) { btn.textContent = soundOn() ? '🔊' : '🔇'; btn.title = soundOn() ? 'ปิดเสียงแจ้งเตือน' : 'เปิดเสียงแจ้งเตือน'; }
  const bar = $('#soundbar'); if (bar) bar.classList.toggle('hidden', !(soundOn() && (!audioCtx || audioCtx.state !== 'running')));
}
['click', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (soundOn() && (!audioCtx || audioCtx.state !== 'running')) ensureAudio(); }, { passive: true }));
// แจ้งเตือนระบบ (มุมจอ/แถบแจ้งเตือนมือถือ) ผ่าน service worker ใช้ได้ทั้งคอมและ Android
async function sysNotify(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return false;
  const opts = { body, tag: 'pr-' + Date.now(), requireInteraction: true, renotify: true, vibrate: [200, 100, 200, 100, 300] };
  try { const reg = await navigator.serviceWorker?.getRegistration(); if (reg) { await reg.showNotification(title, opts); return true; } } catch {}
  try { new Notification(title, opts); return true; } catch { return false; }
}
function notify(title, body) {
  toast(title + '\n' + body, 'new'); beep(); sysNotify(title, body);
}
function rtSet(state) {
  S.rt = state;
  const d = $('#rtDot'); if (!d) return;
  d.className = 'rtdot ' + state;
  d.title = state === 'ok' ? 'เชื่อมต่อเรียลไทม์อยู่' : state === 'wait' ? 'กำลังเชื่อมต่อ...' : 'หลุดการเชื่อมต่อ กำลังต่อใหม่';
}

  if (!('Notification' in window)) problems.push('เบราว์เซอร์นี้ไม่รองรับแจ้งเตือนระบบ');
  else if (Notification.permission === 'denied') problems.push('แจ้งเตือนระบบถูกบล็อก (เปิดในตั้งค่าเว็บไซต์ของเบราว์เซอร์)');
  else if (Notification.permission === 'default') problems.push('ยังไม่ได้กดอนุญาตแจ้งเตือนระบบ');
  if (S.rt !== 'ok') problems.push('ไม่ได้เชื่อมต่อเรียลไทม์ (จุดสีที่หัวแอปไม่เขียว)');
  toast(problems.length ? 'พบปัญหา: ' + problems.join(', ') : 'ทุกอย่างพร้อม จะเตือนทดสอบใน 5 วินาที ลองสลับไปหน้าต่างอื่นดูได้', problems.length ? 'err' : '');
  setTimeout(() => notify('ทดสอบแจ้งเตือน', 'ถ้าได้ยินเสียงและเห็นข้อความนี้ แปลว่าเครื่องนี้พร้อมรับงานแล้ว'), 5000);

function readLines(root) {

/* ======================= เรียลไทม์ ======================= */
let rtTimer;
// อัปเดตเฉพาะแถวที่เปลี่ยน แทนการโหลดทั้งหมดใหม่ ประหยัด Egress ของ Supabase มาก
async function applyChange(p) {
  if (p.eventType === 'DELETE') { S.rows = S.rows.filter(r => r.id !== p.old.id); return; }
  const n = p.new, i = S.rows.findIndex(r => r.id === n.id);
  if (i >= 0) S.rows[i] = { ...S.rows[i], ...n };
  else if (p.eventType === 'INSERT') S.rows.push(n);
  else { const { data } = await sb.from('requests').select('*').eq('id', n.id).maybeSingle(); if (data) S.rows.push(data); }
}
async function resync(announce) {
  const before = new Set(S.rows.map(r => r.id));
  await loadAll(); renderContent(); renderHeaderCounts();
  // งานที่เข้ามาระหว่างเน็ตหลุดหรือเครื่องหลับ ให้เตือนย้อนหลัง
  if (announce && isStaff()) {
    const fresh = S.rows.filter(r => !before.has(r.id) && r.status === 'new' && r.requester_id !== S.me.id);
    if (fresh.length) notify(`มีงานใหม่ ${fresh.length} งาน`, 'เข้ามาระหว่างที่เครื่องหลุดการเชื่อมต่อ: ' + fresh.map(r => pr(r.id)).join(', '));
  }
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (S.me && hiddenAt && Date.now() - hiddenAt > 5 * 60000) resync(true);
});
function subscribe() {
  sb.channel('rt-requests')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'requests' }, p => {
      const n = p.new || {}, o = p.old || {};
      if (p.eventType === 'INSERT' && isStaff() && n.requester_id !== S.me.id) {
        notify('งานใหม่ ' + pr(n.id), `${n.title}\nจาก ${n.requester_name || '-'}  ต้องการ ${fmtD(n.needed_date)}`);
      }
      if (p.eventType === 'UPDATE') {
        const prev = S.rows.find(r => r.id === n.id);
          if (prev && 'unlock' in n && JSON.stringify(prev.unlock || null) !== JSON.stringify(n.unlock || null)) {
            const u = n.unlock, pu = prev.unlock;
            if (u?.state === 'requested' && isStaff() && n.requester_id !== S.me.id && (isAdmin() || (u.sides || []).some(x => mySides().includes(x))))
              notify('ขอปลดล็อกแก้ไข ' + pr(n.id), `${n.title}\n${u.req_by}: ${u.reason}`);
            if (n.requester_id === S.me.id && pu?.state === 'requested') {
              if (u?.state === 'unlocked') notify('ปลดล็อกแล้ว ' + pr(n.id), 'แก้ไขใบงานได้แล้ว (แก้ได้ 1 ครั้ง)');
              else if (!u) notify('ไม่อนุมัติการปลดล็อก ' + pr(n.id), 'ติดต่อเจ้าหน้าที่เพื่อสอบถาม');
            }
          }
        const pl = (prev?.edit_log || []).length, nl = (n.edit_log || []).length;
        const last = (n.edit_log || [])[nl - 1];
        if (prev && nl > pl && last?.kind === 'edit' && last.by !== S.me.full_name && (n.requester_id === S.me.id || (isStaff() && (!last.sides || last.sides.some(x => mySides().includes(x)))))) {
          notify('มีการแก้ไข' + (last.sides ? ' (' + last.sides.map(x => SIDE_LABEL[x]).join(', ') + ')' : '') + ' ' + pr(n.id), `${n.title}\nแก้โดย ${last.by}${last.role ? ' (' + last.role + ')' : ''}: ${(last.changes || []).map(c => c.field).join(', ')}${last.reason ? '\nเหตุผล: ' + last.reason : ''}`);
        }
      }
      if (p.eventType === 'UPDATE' && n.requester_id === S.me.id && !isStaff()) {
        const prev = S.rows.find(r => r.id === n.id);
        if (prev && prev.status !== n.status) notify(pr(n.id) + ' ' + STATUS[n.status], n.title);
      }
      applyChange(p).then(() => {
        clearTimeout(rtTimer);
        rtTimer = setTimeout(() => { renderContent(); renderHeaderCounts(); }, 200);
      });
    }).subscribe(status => {
      // ต่อเรียลไทม์ใหม่หลังเน็ตหลุด: โหลดข้อมูลทั้งหมดหนึ่งครั้งเพื่อเก็บตกที่พลาดไป
      if (status === 'SUBSCRIBED') { rtSet('ok'); if (S.rtReady) resync(true); S.rtReady = true; }
      else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') rtSet('bad');
    });
  sb.channel('rt-returns')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'returns' }, p => {
      const n = p.new || {}, prev = S.returns.find(t => t.id === n.id);
      const req = S.rows.find(r => r.id === n.request_id);
      if (p.eventType === 'INSERT' && isStaff() && n.requester_id !== S.me.id)
        notify('ขอคืนของ ' + rtNo(n.id), `${req ? pr(req.id) + ' ' + req.title : ''}\nคืนโดย ${n.returner_name || '-'}: ${(n.items || []).map(x => `${x.text} ${x.qty} ${x.unit || ''}`).join(', ')}`);
      if (p.eventType === 'UPDATE' && n.requester_id === S.me.id && prev && prev.status !== n.status && n.status === 'received')
        notify('รับคืนของแล้ว ' + rtNo(n.id), `รับคืนโดย ${n.received_by || '-'}`);
      if (p.eventType === 'DELETE') S.returns = S.returns.filter(t => t.id !== p.old.id);
      else { const i = S.returns.findIndex(t => t.id === n.id); if (i >= 0) S.returns[i] = { ...S.returns[i], ...n }; else S.returns.push(n); }
      clearTimeout(rtTimer);
      rtTimer = setTimeout(() => {
        renderContent(); renderHeaderCounts();
        // ถ้าเปิดใบงานนั้นอยู่และไม่ได้พิมพ์อะไรค้าง ให้ส่วนการคืนของอัปเดตทันที
        const typing = document.activeElement && document.activeElement.closest('#sheet') && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
        if (S.modalId === n.request_id && !S.editMode && !$('#rf') && !typing) openDetail(S.modalId, true);
      }, 200);
    }).subscribe();
  sb.channel('rt-me')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles', filter: 'id=eq.' + S.me.id }, async p => {
      if (!p.new.active) { await sb.auth.signOut(); location.reload(); return; }
      if (p.new.role !== S.me.role) { toast('สิทธิ์ของคุณเปลี่ยนเป็น ' + ROLE[p.new.role]); S.me = p.new; await loadAll(); renderShell(); }
    }).subscribe();
}

/* ======================= โครงหน้า ======================= */
function renderShell() {
  const tabs = isAcct() ? [['list', 'รายการเรียบร้อย']] : [['list', 'รายการ'], ['cal', 'ปฏิทิน']];
  if (isStaff()) tabs.unshift(['today', 'สรุปวันนี้']);
  if (isStaff()) tabs.push(['trash', 'ถังขยะ']);
  if (isAdmin()) tabs.push(['users', 'ผู้ใช้และสิทธิ์']);
  if (!tabs.some(t => t[0] === S.view)) S.view = 'list';
  const canNotif = 'Notification' in window && Notification.permission === 'default';
  $('#app').innerHTML = `
  <header class="top"><div class="wrap">
    <span id="rtDot" class="rtdot wait" title="กำลังเชื่อมต่อ..."></span>
    <div class="brand">ระบบรับใบงาน_จัดซื้อ</div>
    <div class="who"><b>${esc(S.me.full_name || S.me.username)}</b>${ROLE[S.me.role]}${S.me.branch ? ' / ' + esc(S.me.branch) : ''}</div>
    ${canNotif ? `<button class="iconbtn" data-act="notif" title="เปิดการแจ้งเตือนบนเครื่องนี้">เปิดแจ้งเตือน</button>` : ''}
    ${isStaff() ? `<button class="iconbtn bell" data-act="gonew" title="งานใหม่และงานที่มีการแก้ไข รอรับทราบ">🔔<span class="n hidden" id="bellN"></span></button>` : ''}
    <button class="iconbtn" id="soundBtn" data-act="sound">🔊</button>
    <button class="iconbtn" data-act="logout">ออก</button>
  </div></header>
  <button id="soundbar" class="soundbar hidden" data-act="unlock">เสียงแจ้งเตือนยังปิดอยู่ แตะที่นี่เพื่อเปิดเสียง</button>
  <main class="wrap">
    <nav class="tabs">${tabs.map(([k, l]) => `<button class="tab ${S.view === k ? 'on' : ''}" data-act="tab" data-v="${k}">${l}${k === 'trash' ? `<span class="c" id="trashN">${trash().length}</span>` : ''}</button>`).join('')}</nav>
    <div id="content"></div>
  </main>`;
  renderContent(); renderHeaderCounts(); updateSoundBar(); rtSet(S.rt || 'wait');
}

function renderHeaderCounts() {
  const n = live().filter(attnAny).length;
  const b = $('#bellN'); if (b) { b.textContent = n; b.classList.toggle('hidden', !n); }
  const t = $('#trashN'); if (t) t.textContent = trash().length;
  document.title = (isStaff() && n ? `(${n}) ` : '') + 'ระบบรับใบงาน_จัดซื้อ';
}

function filtered(base) {
  const q = S.q.trim().toLowerCase();
  return base.filter(r => {
    if (S.view !== 'trash') {
      if (S.filter === 'open' && r.status === 'done') return false;
      if (['new', 'pending', 'done'].includes(S.filter) && r.status !== S.filter) return false;
      if (S.filter === 'attn' && !attnAny(r)) return false;
    }
    if (S.type && r.req_type !== S.type) return false;
    if (!siteOk(r)) return false;
    if (q) {
      const hay = [pr(r.id), r.title, r.detail, r.requester_name, r.branch, r.site, ...Object.values(itemsOf(r)).flat().map(x => x.text), ...(r.vendors || []).map(v => v.name)].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
function sortUrgent(list) {
  return list.sort((a, b) => {
    const da = a.status === 'done' ? 1 : 0, db = b.status === 'done' ? 1 : 0;
    if (da !== db) return da - db;
    if (da) return (b.completed_at || '').localeCompare(a.completed_at || '');
    return a.needed_date.localeCompare(b.needed_date) || a.created_at.localeCompare(b.created_at);
  });
}

const siteSelect = () => `<select class="sel" id="siteSel" aria-label="สาขา"><option value="">ทุกสาขา</option>${CONFIG.SITES.map(x => `<option ${S.site === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>`;
function toolbar(withStatus) {
  if (isAcct()) withStatus = false;
  const counts = { open: 0, new: 0, pending: 0, done: 0, all: 0, attn: 0 };
  live().forEach(r => { counts.all++; counts[r.status]++; if (r.status !== 'done') counts.open++; if (attnAny(r)) counts.attn++; });
  const chips = [['open', 'ยังไม่เสร็จ'], ['new', 'งานใหม่'], ['pending', 'รอดำเนินการ'], ['done', 'เรียบร้อย'], ['all', 'ทั้งหมด']];
  if (isStaff()) chips.unshift(['attn', 'รอยืนยัน']);
  return `<div class="bar">
    ${withStatus ? `<div class="chips">${chips.map(([k, l]) => `<button class="chip ${S.filter === k ? 'on' : ''}" data-act="filter" data-v="${k}">${l} ${counts[k]}</button>`).join('')}</div>` : ''}
    ${siteSelect()}
    <input class="search" id="q" placeholder="ค้นหาเลขที่ ชื่องาน แผนก รายการ ผู้สั่ง ร้าน" value="${esc(S.q)}">
    <button class="btn" data-act="export">ส่งออก Excel</button>
    ${S.view !== 'trash' && !isAcct() ? `<button class="btn primary" data-act="create">+ สร้างคำขอ</button>` : ''}
  </div>`;
}

function renderContent() {
  const c = $('#content'); if (!c) return;
  const focusQ = document.activeElement && document.activeElement.id === 'q';
  if (S.view === 'today') c.innerHTML = renderToday();
  else if (S.view === 'list') c.innerHTML = toolbar(true) + `<div id="listArea"></div>`, renderList();
  else if (S.view === 'cal') c.innerHTML = toolbar(true) + renderCal();
  else if (S.view === 'trash') c.innerHTML = toolbar(false) + renderTrash();
  else if (S.view === 'users') c.innerHTML = renderUsers();
  const q = $('#q');
  if (q) {
    q.oninput = () => { S.q = q.value; if (S.view === 'list') renderList(); else { renderContent(); } };
    if (focusQ) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
  const ss = $('#siteSel'); if (ss) ss.onchange = () => { S.site = ss.value; renderContent(); };
  const ts = $('#typeSel'); if (ts) ts.onchange = () => { S.type = ts.value; renderContent(); };
}

/* ======================= มุมมองรายการ ======================= */
function dueBlock(r) {
  if (r.status === 'done') return ['u-done', '✓', 'เรียบร้อย'];
  const d = daysUntil(r.needed_date);
  if (d < 0) return ['u-over', -d, 'วัน เลยกำหนด'];
  if (d === 0) return ['u-today', 'วันนี้', 'ต้องใช้'];
  return [d <= 3 ? 'u-soon' : 'u-ok', d, 'วัน'];
}
function ticket(r) {
  const [cls, big, small] = dueBlock(r);
  const vend = (r.vendors || []).filter(v => v.name);
  return `<div class="ticket ${cls} ${anyFlag(r) ? 'edited' : ''}" role="button" tabindex="0" data-act="open" data-id="${r.id}">
    <div class="due"><b>${big}</b><span>${small}</span></div>
    <div class="tb">
      <div class="r1">${r.site ? `<span class="site">${esc(r.site)}</span>` : ''}<span class="prno">${pr(r.id)}</span><span class="type">${esc(r.branch || '')}</span>
        ${r.status === 'new' ? '<span class="new-dot" title="ยังไม่มีเจ้าหน้าที่รับทราบ"></span>' : ''}
        ${anyFlag(r) ? `<span class="badge s-edit">แก้ไข: ${flagSides(r).map(x => SIDE_LABEL[x]).join(', ')}</span>` : ''}
        ${hasPendRet(r) ? '<span class="badge s-ret">มีของคืนรอรับ</span>' : ''}
        ${r.unlock?.state === 'requested' ? '<span class="badge s-ret">ขอปลดล็อก</span>' : r.unlock?.state === 'unlocked' ? '<span class="badge s-new">ปลดล็อกแล้ว</span>' : ''}
        <span class="badge s-${r.status}" ${anyFlag(r) ? 'style="margin-left:0"' : ''}>${STATUS[r.status]}</span></div>
      <div class="ttl">${esc(r.title)}</div>
      <div class="meta"><span>ผู้สั่ง <b>${esc(r.requester_name)}</b></span>
        <span>แนบเมื่อ <b>${fmtDT(r.created_at)}</b></span>
        <span>ต้องการ <b>${(() => { const d = itemDates(r); return d.length > 1 ? fmtD(d[0]) + ' ถึง ' + fmtD(d[d.length - 1]) : fmtD(r.needed_date); })()}</b></span>
        ${CONFIG.ITEM_GROUPS.map(([k, l]) => { const n = itemsOf(r)[k].length; return n ? `<span>${l} <b>${n}</b> รายการ</span>` : ''; }).join('')}
        ${(() => { const [b, n] = itemProgress(r); return b ? `<span>ดำเนินการแล้ว <b>${b}/${n}</b></span>` : ''; })()}
        ${(() => { const t = budget(r).total; return t ? `<span>งบ <b>${fmtB(t)}</b></span>` : ''; })()}
        <span>ไฟล์ <b>${(r.files || []).length}</b></span></div>
      ${vend.length ? `<div class="vend">ร้าน/บุคคล: ${vend.map(v => (v.done ? '✓ ' : '') + esc(v.name)).join(', ')}</div>` : ''}
    </div></div>`;
}
function renderList() {
  const list = sortUrgent(filtered(live()));
  $('#listArea').innerHTML = list.length
    ? `<div class="list">${list.map(ticket).join('')}</div>`
    : `<div class="empty">ไม่มีรายการในมุมมองนี้<br><br><button class="btn primary" data-act="create">+ สร้างคำขอ</button></div>`;
}

/* ======================= สรุปวันนี้ ======================= */
const bkDay = iso => iso ? new Date(iso).toLocaleDateString('en-CA', { timeZone: TZ }) : '';
const dueText = r => { const d = daysUntil(r.needed_date); return d < 0 ? `เลย ${-d} วัน` : d === 0 ? 'ใช้วันนี้' : `อีก ${d} วัน`; };
function vendStat(r) {
  if (r.unlock?.state === 'requested') return ['ขอปลดล็อก', true];
  if (anyFlag(r)) return ['แก้ไข: ' + flagSides(r).map(x => SIDE_LABEL[x]).join(', '), true];
  if (r.status === 'new') return ['รอรับทราบ', true];
  const v = (r.vendors || []).filter(x => x.name);
  if (!v.length) return ['ยังไม่ระบุร้าน', true];
  return [`ร้านเสร็จ ${v.filter(x => x.done).length}/${v.length}`, false];
}
function buildToday() {
  const t = todayYMD();
  const open = live().filter(r => r.status !== 'done' && siteOk(r))
    .sort((a, b) => a.needed_date.localeCompare(b.needed_date) || a.created_at.localeCompare(b.created_at));
  const pick = f => open.filter(f);
  const dd = r => daysUntil(r.needed_date);
  const groups = [
    { cls: 'g-attn', title: 'รับทราบงานก่อน', hint: 'งานใหม่และงานที่ถูกแก้ไข ใช้เวลาไม่นาน และทำให้ผู้สั่งรู้ว่าจัดซื้อเห็นงานแล้ว', items: pick(needsAttn) },
    { cls: 'g-over', title: 'เลยกำหนดแล้ว', hint: 'ผู้สั่งต้องใช้ไปแล้ว รีบจัดการหรือโทรแจ้งผู้สั่งว่าจะได้เมื่อไร', items: pick(r => dd(r) < 0) },
    { cls: 'g-today', title: 'ต้องใช้วันนี้', hint: 'ต้องได้ของหรือได้งานภายในวันนี้', items: pick(r => dd(r) === 0) },
    { cls: 'g-soon', title: 'ต้องใช้ภายใน 3 วัน', hint: 'ควรออกซื้อหรือสั่งงานวันนี้ถึงพรุ่งนี้', items: pick(r => dd(r) >= 1 && dd(r) <= 3) },
    { cls: 'g-week', title: 'ต้องใช้ภายใน 7 วัน', hint: 'เริ่มติดต่อร้านหรือขอใบเสนอราคาไว้ก่อน', items: pick(r => dd(r) >= 4 && dd(r) <= 7) },
  ];
  // รวมงานตามร้าน เพื่อออกไปทีเดียวได้หลายงาน
  const plan = {}, noVendor = [];
  open.filter(r => r.status === 'pending' && dd(r) <= 7).forEach(r => {
    const vs = (r.vendors || []).filter(x => x.name);
    if (!vs.length) { noVendor.push(r); return; }
    vs.filter(x => !x.done).forEach(x => {
      const k = x.name.trim().toLowerCase();
      const s = plan[k] ||= { name: x.name.trim(), contact: '', items: [], first: r.needed_date };
      if (!s.contact && x.contact) s.contact = x.contact;
      s.items.push({ r, item: x.item });
      if (r.needed_date < s.first) s.first = r.needed_date;
    });
  });
  const shops = Object.values(plan).sort((a, b) => a.first.localeCompare(b.first) || b.items.length - a.items.length);
  const stats = {
    open: open.length,
    over: groups[1].items.length,
    today: groups[2].items.length,
    inToday: live().filter(r => bkDay(r.created_at) === t).length,
    doneToday: S.rows.filter(r => r.status === 'done' && bkDay(r.completed_at) === t).length,
  };
  const retReq = live().filter(r => hasPendRet(r) && siteOk(r));
  if (retReq.length) groups.splice(1, 0, { cls: 'g-attn', title: 'รอรับคืนของ', hint: 'ผู้สั่งส่งของคืน ตรวจของแล้วกดยืนยันรับคืนในใบงาน', items: retReq });
  return { groups, shops, noVendor, stats };
}
function trow(r) {
  const [vs, warn] = vendStat(r);
  return `<div class="trow" role="button" tabindex="0" data-act="open" data-id="${r.id}">
    <span class="tdue">${dueText(r)}</span><span class="prno">${pr(r.id)}</span>
    <span class="tt"><b>${esc(r.title)}</b><small>${esc(r.requester_name)}${r.branch ? ', แผนก' + esc(r.branch) : ''}, ต้องการ ${fmtD(r.needed_date)}${(() => { const [b, n] = itemProgress(r); return b ? `, ดำเนินการแล้ว ${b}/${n}` : ''; })()}</small></span>
    <span class="vs ${warn ? 'warn' : ''}">${vs}</span></div>`;
}
function renderToday() {
  const { groups, shops, noVendor, stats } = buildToday();
  const dateTxt = new Date().toLocaleDateString('th-TH', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const vis = groups.filter(g => g.items.length);
  let step = 0;
  const groupsHtml = vis.map(g => `<section class="grp ${g.cls}">
      <h3><span class="step">${++step}.</span>${g.title}<span class="cnt">${g.items.length} งาน</span></h3><p>${g.hint}</p>
      ${g.items.map(trow).join('')}</section>`).join('');
  const planHtml = (shops.length || noVendor.length) ? `<section class="grp g-plan">

function renderCal() {
  const m = S.calMonth, y = m.getFullYear(), mo = m.getMonth();
  const start = new Date(y, mo, 1).getDay(), days = new Date(y, mo + 1, 0).getDate();
  const by = {};
  sortUrgent(filtered(live())).forEach(r => { const ds = itemDates(r); (ds.length ? ds : [r.needed_date]).forEach(d => (by[d] ||= []).push(r)); });
  const today = todayYMD();
  let cells = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < start; i++) cells += `<div class="cell empty"></div>`;
  for (let d = 1; d <= days; d++) {
    const ymd = `${y}-${String(mo + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const ev = (by[ymd] || []).map(r => {
      const over = r.status !== 'done' && ymd < today;
      return `<div class="cev s-${r.status} ${over ? 'over' : ''}" data-act="open" data-id="${r.id}" title="${esc(pr(r.id) + ' ' + r.title + ' (' + STATUS[r.status] + ')')}">${pr(r.id).slice(3)}<span class="t"> ${esc(r.title)}</span></div>`;
    }).join('');
    cells += `<div class="cell ${ymd === today ? 'today' : ''}"><span class="d">${d}</span>${ev}</div>`;
  }
  return `<div class="calhead"><h3>${new Date(y, mo, 1).toLocaleDateString('th-TH', { month: 'long', year: 'numeric' })}</h3>
    <button class="btn sm" data-act="calPrev">‹ ก่อนหน้า</button><button class="btn sm" data-act="calToday">เดือนนี้</button><button class="btn sm" data-act="calNext">ถัดไป ›</button></div>
    <div class="cal">${cells}</div>`;
}

async function uploadFiles(files) {
  const out = [];
  for (const f of files) {
    const ext = (f.name.split('.').pop() || 'bin').replace(/[^a-z0-9]/gi, '').slice(0, 8);
    const path = `${todayYMD().slice(0, 7)}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const { error } = await sb.storage.from(CONFIG.BUCKET).upload(path, f, { contentType: f.type || undefined });
    if (error) throw new Error(`อัปโหลด ${f.name} ไม่สำเร็จ: ${error.message}`);
    out.push({ name: f.name, path, size: f.size, type: f.type, uploaded_at: new Date().toISOString(), uploaded_by: S.me.full_name });
  }
  return out;
}

      if (files.length) sb.storage.from(CONFIG.BUCKET).remove(files.map(z => z.path)).catch(() => {});
      toast(x.message, 'err'); btn.disabled = false; btn.textContent = 'ส่งคืนของ';
    }
  };

function printHtml(html) {
  const fr = document.createElement('iframe');
  fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(fr);
  const d = fr.contentDocument; d.open(); d.write(html); d.close();
  let printed = false;
  const go = () => {
    if (printed) return; printed = true;
    try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch { toast('พิมพ์ไม่สำเร็จ ลองเปิดจากเบราว์เซอร์ Chrome', 'err'); }
    setTimeout(() => fr.remove(), 60000);
  };
  fr.onload = () => (d.fonts ? d.fonts.ready.then(go) : go());
  setTimeout(go, 3000);
}

    const up = await uploadFiles(files.filter(f => f.size <= CONFIG.MAX_FILE_MB * 1048576));
    if (await patch(id, { files: [...(r.files || []), ...up] }, 'แนบไฟล์เพิ่มแล้ว')) openDetail(id);
  } catch (x) { toast(x.message, 'err'); }
}
async function purge(ids) {
  const rows = S.rows.filter(r => ids.includes(r.id));
  const paths = [...rows.flatMap(r => (r.files || []).map(f => f.path)), ...S.returns.filter(t => ids.includes(t.request_id)).flatMap(t => (t.files || []).map(f => f.path))];
  if (paths.length) await sb.storage.from(CONFIG.BUCKET).remove(paths).catch(() => {});
  const { error } = await sb.from('requests').delete().in('id', ids);
  if (error) return toast(error.message, 'err');
  S.rows = S.rows.filter(r => !ids.includes(r.id));
  toast(`ลบถาวรแล้ว ${ids.length} รายการ`);
  closeModal(); renderContent(); renderHeaderCounts();
}

/* ======================= ส่งออก Excel ======================= */
function exportExcel() {
  const inTrash = S.view === 'trash';
  const list = inTrash ? filtered(trash()) : sortUrgent(filtered(live()));
  if (!list.length) return toast('ไม่มีรายการให้ส่งออก', 'err');
  const bk = iso => iso ? new Date(iso).toLocaleString('th-TH', { timeZone: TZ }) : '';
  const rows = list.map(r => {
    const o = {
      'เลขที่': pr(r.id), 'สาขา': r.site || '', 'ชื่องาน': r.title, 'แผนก': r.branch || '',
      ...Object.fromEntries(CONFIG.ITEM_GROUPS.map(([k, l]) => ['รายการ' + l, itemsOf(r)[k].map((x, i) => `${i + 1}. ${itemLabel(x)}`).join('\n')])),
      'ผู้สั่ง': r.requester_name, 'วันเวลาที่แนบ': bk(r.created_at), 'วันที่ต้องการใช้ (เร็วสุด)': fmtD(r.needed_date),
      'สถานะ': STATUS[r.status],
      'ร้าน / บุคคล': (r.vendors || []).filter(v => v.name).map(v => `${v.name}${v.item ? ' (' + v.item + ')' : ''}${v.contact ? ' ' + v.contact : ''}${v.done ? ' ✓' : ''}`).join('\n'),
      'หมายเหตุเจ้าหน้าที่': r.staff_note || '',
      'รับทราบโดย': r.acknowledged_by || '', 'เวลารับทราบ': bk(r.acknowledged_at),
      'เรียบร้อยโดย': r.completed_by || '', 'เวลาเรียบร้อย': bk(r.completed_at),
      'แก้ไขแล้ว (ครั้ง)': (r.edit_log || []).filter(e => e.kind === 'edit').length,
      'การแก้ไขรอยืนยัน': flagSides(r).map(x => SIDE_LABEL[x]).join(', '),
      'ประวัติการแก้ไข': (r.edit_log || []).map(e => e.kind === 'ack' ? `${bk(e.at)} รับทราบโดย ${e.by}` : `${bk(e.at)} แก้โดย ${e.by}: ${(e.changes || []).map(c => c.from === undefined ? `${c.field} ${c.to}` : `${c.field} จาก "${c.from ?? ''}" เป็น "${c.to ?? ''}"`).join('; ')}`).join('\n'),
      'งบรวม (บาท)': budget(r).total, 'เงินคืน (บาท)': budget(r).refund, 'งบสุทธิ (บาท)': budget(r).net,
      'การคืนของ': returnsOf(r.id).map(t => `${rtNo(t.id)} ${t.status === 'received' ? 'รับคืนแล้ว' : 'รอรับคืน'}: ${(t.items || []).map(x => `${x.text} ${x.qty} ${x.unit || ''}`.trim()).join(', ')}${t.refund_amount != null ? `, เงินคืน ${fmtB(t.refund_amount)} บาท` : ''}`).join('\n'),
      'จำนวนไฟล์': (r.files || []).length, 'ชื่อไฟล์': (r.files || []).map(f => f.name).join(', '),
    };
    if (inTrash) { o['ลบเมื่อ'] = bk(r.deleted_at); o['ลบโดย'] = r.deleted_by || ''; }
    return o;
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = Object.keys(rows[0]).map(k => ({ wch: ['ชื่องาน', 'รายการจัดซื้อ', 'รายการโมริริน', 'การคืนของ', 'ร้าน / บุคคล', 'หมายเหตุเจ้าหน้าที่', 'ชื่อไฟล์', 'ประวัติการแก้ไข'].includes(k) ? 36 : 18 }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, inTrash ? 'ถังขยะ' : 'ใบงาน');
  XLSX.writeFile(wb, `${inTrash ? 'ถังขยะ_ระบบรับใบงาน_จัดซื้อ' : 'ระบบรับใบงาน_จัดซื้อ'}_${todayYMD()}.xlsx`);
}

/* ======================= modal ======================= */
function openModal(html) { $('#sheet').innerHTML = html; $('#modal').classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
function closeModal() { $('#modal').classList.add('hidden'); document.body.style.overflow = ''; S.modalId = null; S.editMode = null; clearInterval(clockTimer); clearInterval(clockTimer2); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) closeModal();
  if (e.key === 'Enter' && e.target.matches('.ticket, .trow')) e.target.click();
});

/* ======================= ปุ่มทั้งหมด ======================= */
const now = () => new Date().toISOString();
const A = {
  lineAdd: el => { const box = el.closest('.lines').querySelector('.lrows'); addLineAfter(box.lastElementChild, box); },
  lineDel: el => { const row = el.closest('.line'), box = row.parentElement; if (box.children.length > 1) row.remove(); else { row.querySelector('.lt').value = ''; row.querySelector('.ld').value = ''; } renumber(box); },
  testNotify: () => { ensureAudio(); testNotify(); },
  returnForm: (el, id) => openReturnForm(id),
  pickFile: () => $('#fpick')?.click(),
  unlockForm: (el, id) => openUnlockForm(id),
  unlockApprove: async (el, id) => { if (await patch(id, { unlock: { state: 'unlocked' } }, 'ปลดล็อกแล้ว ผู้สั่งแก้ไขได้ 1 ครั้ง')) openDetail(id, true); },
  unlockReject: async (el, id) => { if (!confirm('ไม่อนุมัติคำขอปลดล็อกนี้?')) return; if (await patch(id, { unlock: null }, 'ไม่อนุมัติคำขอปลดล็อกแล้ว')) openDetail(id, true); },
  unlockCancel: async (el, id) => { if (await patch(id, { unlock: null }, 'ยกเลิกคำขอปลดล็อกแล้ว')) openDetail(id, true); },
  relock: async (el, id) => { if (!confirm('ล็อกใบงานกลับ? ผู้สั่งจะแก้ไขไม่ได้จนกว่าจะขอปลดล็อกใหม่')) return; if (await patch(id, { unlock: null }, 'ล็อกกลับแล้ว')) openDetail(id, true); },
  linePanel: (el, id) => openLinePanel(id, el.dataset.g, +el.dataset.i),
  lineUndo: async (el, id) => {
    if (!confirm('ยกเลิกสถานะดำเนินการแล้วของบรรทัดนี้? ราคาและใบเสร็จของบรรทัดนี้จะถูกนำออก')) return;
    const r = S.rows.find(x => x.id === id), g = el.dataset.g, i = +el.dataset.i, arr = itemsOf(r)[g];
    ['bought', 'bought_by', 'bought_at', 'price', 'receipts'].forEach(k => delete arr[i][k]);
    if (await patch(id, { items: { ...(r.items || {}), [g]: arr } }, 'ยกเลิกสถานะดำเนินการแล้ว')) openDetail(id, true);
  },
  refundForm: el => openRefundForm(+el.dataset.rid),

  retConfirm: async el => {
    const t = S.returns.find(x => x.id === +el.dataset.rid); if (!t) return;
    if (!confirm(`ยืนยันว่าได้รับของคืนตาม ${rtNo(t.id)} ครบแล้ว?`)) return;
    const { data, error } = await sb.from('returns').update({ status: 'received' }).eq('id', t.id).select().single();
    if (error) return toast(error.message, 'err');
    Object.assign(t, data); toast('ยืนยันรับคืนแล้ว พิมพ์ใบคืนของได้เลย');
    renderContent(); renderHeaderCounts(); openDetail(t.request_id, true);
  },
  retCancel: async el => {
    const t = S.returns.find(x => x.id === +el.dataset.rid); if (!t) return;
    if (!confirm(`ยกเลิกการคืนของ ${rtNo(t.id)}?`)) return;
    const { error } = await sb.from('returns').delete().eq('id', t.id);
    if (error) return toast(error.message, 'err');
    if ((t.files || []).length) sb.storage.from(CONFIG.BUCKET).remove(t.files.map(f => f.path)).catch(() => {});
    S.returns = S.returns.filter(x => x.id !== t.id); toast('ยกเลิกการคืนแล้ว');
    renderContent(); renderHeaderCounts(); openDetail(t.request_id, true);
  },
  printReq: (el, id) => { const r = S.rows.find(x => x.id === id); if (r) printRequest(r); },
  retPrint: el => { const t = S.returns.find(x => x.id === +el.dataset.rid); if (t) printReturn(t); },
  copySummary: async () => { await copyText(summaryText()); toast('คัดลอกสรุปแล้ว วางในไลน์กลุ่มได้เลย'); },
  sound: () => {
    const on = !soundOn();
    try { localStorage.setItem('pr_sound', on ? 'on' : 'off'); } catch {}
    updateSoundBar();
    if (on) { beep(true); toast('เปิดเสียงแจ้งเตือนแล้ว'); } else toast('ปิดเสียงแจ้งเตือนแล้ว');
  },
  unlock: () => { ensureAudio(); beep(true); toast('เปิดเสียงแจ้งเตือนแล้ว'); },
  authmode: el => renderAuth(el.dataset.v),
  logout: async () => { await sb.auth.signOut(); location.reload(); },
  notif: async () => { ensureAudio(); const p = await Notification.requestPermission(); renderShell(); if (p === 'granted') sysNotify('เปิดแจ้งเตือนแล้ว', 'เครื่องนี้จะได้รับแจ้งเตือนเมื่อมีงานเข้า'); },
  gonew: () => { S.view = 'list'; S.filter = 'attn'; renderShell(); },
  tab: el => { S.view = el.dataset.v; renderShell(); },
  filter: el => { S.filter = el.dataset.v; renderContent(); },
  create: () => openCreate(),
  unpick: el => { S.pendingFiles.splice(+el.dataset.i, 1); drawPending(); },
  close: () => closeModal(),
  open: (el, id) => { S.editMode = null; openDetail(id); },
  export: () => exportExcel(),
  calPrev: () => { S.calMonth.setMonth(S.calMonth.getMonth() - 1); renderContent(); },
  calNext: () => { S.calMonth.setMonth(S.calMonth.getMonth() + 1); renderContent(); },
  calToday: () => { S.calMonth = new Date(); S.calMonth.setDate(1); renderContent(); },
  file: async el => {
    const w = window.open('', '_blank');
    const { data, error } = await sb.storage.from(CONFIG.BUCKET).createSignedUrl(el.dataset.path, 600);
    if (error) { w && w.close(); return toast('เปิดไฟล์ไม่สำเร็จ', 'err'); }
    if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
  },
  ack: async (el, id) => { if (await patch(id, { status: 'pending', acknowledged_by: S.me.full_name, acknowledged_at: now() }, 'รับทราบแล้ว สถานะเป็นรอดำเนินการ')) openDetail(id); },
  ackEdit: async (el, id) => { const f = el.dataset.side === 'moririn' ? { edit_flag_m: false } : { edit_flag: false }; if (await patch(id, f, 'ยืนยันรับทราบการแก้ไขแล้ว')) openDetail(id); },
  addVendor: () => { readVendorInputs(); S.editVendors.push({ name: '', contact: '', item: '', done: false }); openDetail(S.modalId, true); setTimeout(() => { const l = document.querySelectorAll('#vrows [data-vf=name]'); l[l.length - 1]?.focus(); }, 0); },
  delVendor: el => { readVendorInputs(); S.editVendors.splice(+el.dataset.i, 1); openDetail(S.modalId, true); },
  saveVendors: async (el, id) => {
    readVendorInputs();
    const vendors = S.editVendors.filter(v => v.name);
    if (await patch(id, { vendors, staff_note: ($('#staffNote')?.value || '').trim() || null }, 'บันทึกร้านและหมายเหตุแล้ว')) openDetail(id);
  },
  done: async (el, id) => {
    readVendorInputs();
    const r = S.rows.find(x => x.id === id);
    if (anyFlag(r)) return toast('มีการแก้ไขที่ยังไม่ได้ยืนยัน (' + flagSides(r).map(x => SIDE_LABEL[x]).join(', ') + ') ต้องยืนยันก่อน', 'err');
    const changed = JSON.stringify(S.editVendors.filter(v => v.name)) !== JSON.stringify(r.vendors || []);
    const pend = Object.values(itemsOf(r)).flat().filter(x => !x.bought).length;
    if (!confirm(`ยืนยันเปลี่ยน ${pr(id)} เป็น "เรียบร้อย"?${pend ? `\n\nยังมี ${pend} บรรทัดที่ยังไม่ได้กดดำเนินการแล้ว (ไม่มีราคา)` : ''}\nใช้งบรวม ${fmtB(budget(r).total)} บาท`)) return;
    const fields = { status: 'done', completed_by: S.me.full_name, completed_at: now() };
    if (changed) fields.vendors = S.editVendors.filter(v => v.name);
    if (await patch(id, fields, 'เปลี่ยนเป็นเรียบร้อยแล้ว')) closeModal();
  },
  reopen: async (el, id) => { if (await patch(id, { status: 'pending', completed_by: null, completed_at: null }, 'ย้อนกลับเป็นรอดำเนินการแล้ว')) openDetail(id); },
  edit: el => { S.editMode = S.editMode ? null : (el.dataset.v || null); S.pendingFiles = []; openDetail(S.modalId, true); },
  editSave: async (el, id) => {
    const r = S.rows.find(x => x.id === id), owner = S.editMode === 'owner';
    const t = $('#e_title').value.trim(); if (!t) return toast('ใส่ชื่องานก่อนบันทึก', 'err');
    const { items, count, missing, earliest } = readLines($('#e_items'));
    if (!count) return toast('ต้องมีรายการอย่างน้อย 1 บรรทัด', 'err');
    if (missing) return toast('ใส่วันที่ต้องการใช้ให้ครบทุกบรรทัด', 'err');
    const reason = $('#e_reason').value.trim();
    const picked = owner ? S.pendingFiles : [];
    el.disabled = true; el.textContent = 'กำลังบันทึก...';
    let up = [];
    try {
      up = await uploadFiles(picked);
      const fields = { site: $('#e_site').value, branch: $('#e_b').value.trim(), title: t, items, needed_date: earliest || r.needed_date, edit_reason: reason || null };
      if (up.length) fields.files = [...(r.files || []), ...up];
      if (await patch(id, fields, r.status === 'new' || !owner ? 'บันทึกการแก้ไขแล้ว' : 'บันทึกแล้ว แจ้งเตือนเจ้าหน้าที่แล้ว')) { S.editMode = null; openDetail(id); return; }
    } catch (x) { toast(x.message, 'err'); }
    if (up.length) sb.storage.from(CONFIG.BUCKET).remove(up.map(f => f.path)).catch(() => {});
    el.disabled = false; el.textContent = 'บันทึกการแก้ไข';
  },
  cancelReq: async (el, id) => {
    if (!confirm(`ยกเลิกใบงาน ${pr(id)}? ใบงานจะถูกย้ายไปถังขยะ`)) return;
    if (await patch(id, { deleted_at: now(), deleted_by: S.me.full_name + ' (ผู้สั่งยกเลิก)' }, 'ยกเลิกใบงานแล้ว')) closeModal();
  },
  toggleBought: async (el, id) => {
    const r = S.rows.find(x => x.id === id), g = el.dataset.g, i = +el.dataset.i;
    const arr = itemsOf(r)[g], line = arr[i]; if (!line) return;
    if (line.bought) { delete line.bought; delete line.bought_by; delete line.bought_at; }
    else Object.assign(line, { bought: true, bought_by: S.me.full_name, bought_at: now() });
    const items = { ...(r.items || {}), [g]: arr };
    if (await patch(id, { items }, line.bought ? 'บันทึกว่าดำเนินการแล้ว' : 'ยกเลิกสถานะดำเนินการแล้ว')) openDetail(id, true); else openDetail(id, true);
  },
  trash: async (el, id) => { if (!confirm(`ย้าย ${pr(id)} ลงถังขยะ? กู้คืนได้ภายหลัง`)) return; if (await patch(id, { deleted_at: now(), deleted_by: S.me.full_name }, 'ย้ายลงถังขยะแล้ว')) closeModal(); },
  restore: async (el, id) => { if (await patch(id, { deleted_at: null, deleted_by: null, restored_at: now() }, 'กู้คืนแล้ว')) closeModal(); },
  purge: async (el, id) => { if (confirm(`ลบ ${pr(id)} ถาวรพร้อมไฟล์แนบ? กู้คืนไม่ได้อีก`)) await purge([id]); },
  purgeAll: async () => { const ids = filtered(trash()).map(r => r.id); if (confirm(`ลบถาวรทั้งหมด ${ids.length} รายการพร้อมไฟล์แนบ? กู้คืนไม่ได้อีก`)) await purge(ids); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A' || el.dataset.act === 'open') e.preventDefault();
  fn(el, el.dataset.id ? Number(el.dataset.id) : null);
});

init();
</script>
